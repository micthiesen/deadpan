[package]
name = "deadpan-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Host qualification of complete native bridge candidate bundles"

[dependencies]
deadpan-analysis.workspace = true
deadpan-core.workspace = true
deadpan-jobs.workspace = true
deadpan-media.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
blake3.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["fs"] }
# HTTPS model-pack downloads only; rustls with the system trust store.
# Ed25519 verification of signed update manifests (already linked by rustls).
ring = "=0.17.14"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
deadpan-chaos.workspace = true
# Test-only local HTTPS server for the interrupted-download test; same
# version and ring provider as the ureq client.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
deadpan-store.workspace = true
tempfile.workspace = true

[lints]
workspace = true
