[package]
name = "deadpan-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Exact timing, validated beat documents, and reversible editing commands"

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }

[features]
# Equivalence oracles for the local command-work replacements; never enabled
# by production crates. The crate's own integration tests enable it below.
test-support = []

[dev-dependencies]
deadpan-chaos.workspace = true
deadpan-core = { workspace = true, features = ["test-support"] }
proptest.workspace = true

[lints]
workspace = true
