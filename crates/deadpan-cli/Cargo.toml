[package]
name = "deadpan-cli"
description = "Headless project, editing, history, and diagnostic commands for Deadpan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test and UI-replay stand-in for the AI model worker. Never a provider; the
# shipped CLI and app do not compile it.
synthetic-worker = []

[dependencies]
deadpan-diagnostics.workspace = true
deadpan-core.workspace = true
deadpan-store.workspace = true
deadpan-plan.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
deadpan-media.workspace = true
deadpan-audio.workspace = true
deadpan-render.workspace = true
deadpan-source.workspace = true
deadpan-models.workspace = true
deadpan-jobs.workspace = true
deadpan-analysis.workspace = true
deadpan-encode.workspace = true
deadpan-filesystem.workspace = true
wgpu.workspace = true
pollster.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["system", "net"] }
deadpan-native-process.workspace = true
tempfile.workspace = true
signal-hook.workspace = true
# Extracts the pinned Deno executable from its verified release archive.
flate2 = "=1.1.10"
# Conditioning frames for local AI holds: contain-resize and PNG encoding.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
# Integration tests build accepted AI pauses with the synthetic worker.
deadpan-cli = { path = ".", features = ["synthetic-worker"] }
deadpan-chaos.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
deadpan-native-process.workspace = true
# Real-device audition in the `perf` benchmark example (docs/PERFORMANCE.md).
deadpan-playback.workspace = true

[lints]
workspace = true
