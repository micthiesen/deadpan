[package]
name = "deadpan-app"
description = "Native macOS host for the Deadpan structural video editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
eframe.workspace = true
deadpan-cli = { path = "../deadpan-cli" }
deadpan-core.workspace = true
deadpan-store.workspace = true
deadpan-plan.workspace = true
deadpan-media.workspace = true
deadpan-render.workspace = true
deadpan-playback.workspace = true
deadpan-output.workspace = true
deadpan-source.workspace = true
sha2.workspace = true
rustix.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "=0.17.2", default-features = false }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSFileManager", "NSArray", "NSURL", "NSString", "NSPathUtilities"] }

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
