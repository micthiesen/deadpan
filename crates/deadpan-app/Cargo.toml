[package]
name = "deadpan-app"
description = "Native macOS host for the Deadpan structural video editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Developer-only whole-workspace replay. The shipped app does not include the runner.
ui-harness = ["dep:deadpan-native-process", "dep:egui_kittest", "dep:image", "dep:tempfile"]

[dependencies]
eframe.workspace = true
deadpan-cli = { path = "../deadpan-cli" }
deadpan-audio.workspace = true
deadpan-core.workspace = true
deadpan-analysis.workspace = true
deadpan-models.workspace = true
deadpan-store.workspace = true
deadpan-plan.workspace = true
deadpan-media.workspace = true
deadpan-render.workspace = true
deadpan-playback.workspace = true
deadpan-output.workspace = true
deadpan-source.workspace = true
deadpan-native-process = { workspace = true, optional = true }
deadpan-jobs.workspace = true
sha2.workspace = true
rustix.workspace = true
uuid.workspace = true
egui_kittest = { version = "=0.36.2", default-features = false, features = ["eframe", "wgpu"], optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Validate system font faces with the same parser already used by epaint.
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
rfd = { version = "=0.17.2", default-features = false }
# Native menu bar; macOS backend only.
muda = { version = "=0.21.0", default-features = false }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSBundle", "NSFileManager", "NSArray", "NSURL", "NSString", "NSPathUtilities"] }

[dev-dependencies]
blake3.workspace = true
deadpan-native-process.workspace = true
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
