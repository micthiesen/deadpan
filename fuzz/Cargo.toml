# Coverage-guided libFuzzer targets for Deadpan's untrusted input boundaries.
# A separate workspace: the product toolchain stays pinned stable, while these
# targets build only with `cargo +nightly fuzz` through `cargo xtask fuzz`.
# See docs/ADVERSARIAL.md.
[package]
name = "deadpan-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "=0.4.13"
deadpan-app = { path = "../crates/deadpan-app", features = ["fuzzing"] }
deadpan-analysis = { path = "../crates/deadpan-analysis" }
deadpan-chaos = { path = "../crates/deadpan-chaos" }
deadpan-cli = { path = "../crates/deadpan-cli" }
deadpan-core = { path = "../crates/deadpan-core" }
deadpan-jobs = { path = "../crates/deadpan-jobs" }
deadpan-media = { path = "../crates/deadpan-media" }
deadpan-models = { path = "../crates/deadpan-models" }
deadpan-source = { path = "../native/deadpan-source", features = ["fuzzing"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "app-keymap-config"
path = "fuzz_targets/app-keymap-config.rs"
test = false
doc = false
bench = false

