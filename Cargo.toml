[workspace]
resolver = "3"
members = ["crates/deadpan-core", "crates/deadpan-store", "crates/deadpan-plan", "crates/deadpan-jobs", "crates/deadpan-media", "crates/deadpan-models", "crates/deadpan-render", "crates/deadpan-app", "crates/deadpan-cli", "native/deadpan-process", "native/deadpan-media-worker", "native/deadpan-source"]
default-members = ["crates/deadpan-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/micthiesen/deadpan"
publish = false

[workspace.dependencies]
deadpan-core = { path = "crates/deadpan-core" }
deadpan-store = { path = "crates/deadpan-store" }
deadpan-plan = { path = "crates/deadpan-plan" }
deadpan-jobs = { path = "crates/deadpan-jobs" }
deadpan-media = { path = "crates/deadpan-media" }
deadpan-models = { path = "crates/deadpan-models" }
deadpan-render = { path = "crates/deadpan-render" }
deadpan-source = { path = "native/deadpan-source" }
deadpan-native-process = { path = "native/deadpan-process" }
cc = "=1.4.7"
libc = "=0.2.189"
rustix = { version = "=1.1.5", features = ["process", "fs"] }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["metal", "wgsl"] }
pollster = "=1.0.1"
proptest = "=1.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
blake3 = "=1.8.7"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
tempfile = "=3.27.0"
thiserror = "=2.0.20"
uuid = { version = "=1.26.1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
overflow-checks = true
