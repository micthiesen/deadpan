name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS workspace
    # The product targets macOS 26 (model packs require it).
    runs-on: macos-26
    timeout-minutes: 300
    env:
      # Optimized dev-profile code keeps debug assertions and overflow checks.
      # Audio preparation and export tests bound their work with wall-clock
      # deadlines that unoptimized builds miss; `cargo xtask check` and
      # `cargo xtask gate` use the same level.
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      # Every run builds from scratch; incremental state only costs time.
      CARGO_INCREMENTAL: "0"
      # As in `cargo xtask gate`: synthetic-worker tests fail rather than skip
      # when their development ffmpeg is missing.
      DEADPAN_REQUIRE_SYNTHETIC_WORKER: "1"
      # Unlike the gate, CI leaves DEADPAN_REQUIRE_PHYSICAL_MAC unset: this
      # runner is a virtual machine, so encoded Render, VideoToolbox and GPU
      # exactness checks skip here and run on a physical Mac
      # (docs/DEVELOPMENT.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build pinned LGPL FFmpeg
        run: |
          if ! command -v gpg >/dev/null; then
            brew install gnupg
          fi
          for tool in meson ninja; do
            if ! command -v "$tool" >/dev/null; then
              brew install "$tool"
            fi
          done
          python3 tools/media-qualification/compatible/build.py \
            --work "$RUNNER_TEMP/deadpan-ffmpeg" \
            --output "$RUNNER_TEMP/deadpan-ffmpeg-build.json"
          echo "DEADPAN_FFMPEG_PREFIX=$RUNNER_TEMP/deadpan-ffmpeg/prefix" >> "$GITHUB_ENV"
      - name: Prepare pinned ONNX Runtime
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_prepare_ort.py' -v
          python3 tools/prepare-ort.py --prefix "$RUNNER_TEMP/deadpan-ort/prefix" \
            > "$RUNNER_TEMP/deadpan-ort-build.json"
          echo "DEADPAN_ORT_PREFIX=$RUNNER_TEMP/deadpan-ort/prefix" >> "$GITHUB_ENV"
      - name: Install test tools
        # Fixture and synthetic-worker tests run Homebrew's ffmpeg (with
        # libx264), separate from the pinned LGPL build the product uses. The
        # offline privacy audit resolves every platform's dependencies.
        run: |
          if [ ! -x /opt/homebrew/bin/ffmpeg ]; then
            brew install ffmpeg
          fi
          cargo fetch --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        # A hung test must leave time for the independent steps below.
        timeout-minutes: 180
        run: >-
          cargo test --workspace --exclude deadpan-core --exclude deadpan-plan
          --exclude deadpan-store --locked --no-fail-fast -- --skip general_split_sound
      - name: Test Split sound delivery
        if: ${{ !cancelled() }}
        timeout-minutes: 120
        # Each read has a 60 s deadline; contention with the rest of the
        # stages binary on a virtual Mac exceeded it (run 42434393483).
        # The nested-play case's limiter read alone exceeded 60 s beside one
        # other case (run 42492910881), so it runs last, by itself.
        run: |
          cargo test -p deadpan-audio --test stages --locked general_split_sound -- --test-threads=2 --skip nested_selected_play_split
          cargo test -p deadpan-audio --test stages --locked nested_selected_play_split -- --test-threads=1
      - name: Test unoptimized packages
        if: ${{ !cancelled() }}
        timeout-minutes: 90
        # As in `cargo xtask gate`: these pass unoptimized, and their test
        # targets dominate an optimized build.
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
        run: >-
          cargo test -p deadpan-core -p deadpan-plan -p deadpan-store --locked
          --no-fail-fast
      - name: UI feedback and shortcut contracts
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p deadpan-app --features ui-harness --all-targets --locked -- -D warnings
          cargo test -p deadpan-app --features ui-harness --locked --no-fail-fast
      - name: Source audio fixture reproducibility
        if: ${{ !cancelled() }}
        run: python3 native/deadpan-source/tests/generate_audio_fixtures.py --verify
      - name: Audio measurement regression tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/audio-qualification -p 'test_*.py' -v
      - name: Model worker contract tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/model-qualification/tests -p 'test_*.py' -v
      - name: FFV1 qualification report tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/media-qualification/ffv1 -p 'test_*.py' -v
      - name: Native media harness tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s tools/media-qualification/host -p 'test_*.py' -v
