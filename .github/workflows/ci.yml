name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS workspace
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Audio measurement regression tests
        run: python3 -m unittest discover -s tools/audio-qualification -p 'test_*.py' -v
      - name: Model worker contract tests
        run: python3 -m unittest discover -s tools/model-qualification/tests -p 'test_*.py' -v
      - name: FFV1 qualification report tests
        run: python3 -m unittest discover -s tools/media-qualification/ffv1 -p 'test_*.py' -v
      - name: Build
        run: cargo build --workspace --locked
      - name: Headless diagnostics
        run: cargo run --locked -p deadpan-cli -- doctor
