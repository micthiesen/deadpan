# A test still running after five minutes is reported and stopped, so a
# hung real-media or worker test cannot hold a run for half an hour.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Tests that attach a private APFS disk image and fill it. APFS releases
# space asynchronously, and several images filling at once on the same
# host keep each other from staying full, so they run one at a time.
[test-groups]
disk-images = { max-threads = 1 }
# Each read keeps the product's 60 second limit, which fails if many of these
# complete-PCM comparisons compete for the same cores.
split-matrix = { max-threads = 4 }

[[profile.default.overrides]]
filter = """
binary(storage_failures) | binary(storage_failures_media) | binary(proxy_disk_full)
| binary(model_pack_import_disk_full)
| test(=packs::disk_full_tests::a_volume_that_fills_during_a_download_fails_truthfully_and_resumes)
| test(/a_full_destination_volume_publishes_nothing_and_keeps_the_candidate$/)
| test(/a_full_disk_never_reports_saved_and_its_alert_clears_after_a_real_save$/)
"""
test-group = "disk-images"

# Exhaustive fault-injection sweeps: each takes about nine minutes, so they
# start first to overlap the rest of the run.
[[profile.default.overrides]]
filter = "test(/stage_block_policy_every_real_(plan|cache)_callback/)"
slow-timeout = { period = "60s", terminate-after = 20 }
priority = 100

# Encoded export runs take three to five minutes each and share the machine,
# so the default limit stops valid runs under load.
[[profile.default.overrides]]
filter = "binary(preview_export)"
slow-timeout = { period = "60s", terminate-after = 10 }

# Each compares complete PCM before and after Split across every parent kind.
[[profile.default.overrides]]
filter = "binary(stages) & test(general_split_sound)"
slow-timeout = { period = "60s", terminate-after = 40 }
priority = 90
test-group = "split-matrix"
threads-required = 6

# Proxy builds hold a VideoToolbox session; the test lock serialises them
# with each other but not with the encoded-render tests in other binaries.
# Under that contention VideoToolbox has once returned a picture the proxy
# verifier correctly refuses ("not an in-order intra picture", 2026-11-08).
# One retry keeps that hardware contention from failing a valid run; a
# second failure is a real result.
[[profile.default.overrides]]
filter = "binary(proxy_resume) | binary(proxy_disk_full)"
retries = 1

# The same hardware encoder can, under a loaded gate, emit one picture out of
# order (the worker refuses it as invalid_packet). The app retries that once
# (`deadpan_media::retryable`); these direct worker tests do not, so they get
# the same single retry. A second failure is a real result.
[[profile.default.overrides]]
filter = "binary(proxy_real_media)"
retries = 1
