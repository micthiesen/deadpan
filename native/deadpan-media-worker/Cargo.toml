[package]
name = "deadpan-media-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Isolated descriptor-only FFV1 conversion worker"

[[bin]]
name = "deadpan-media-worker"
path = "src/main.rs"

[dependencies]
deadpan-media.workspace = true
deadpan-source.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[build-dependencies]
cc.workspace = true

[dev-dependencies]
deadpan-native-process.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png"] }
deadpan-chaos.workspace = true
rustix.workspace = true
blake3.workspace = true
deadpan-cli = { path = "../../crates/deadpan-cli" }
deadpan-core.workspace = true
deadpan-jobs.workspace = true
deadpan-models.workspace = true
deadpan-store.workspace = true
sha2.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
