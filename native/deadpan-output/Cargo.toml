[package]
name = "deadpan-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bounded prepared-PCM output queue and narrow macOS device boundary"

[dependencies]
rtrb.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cpal.workspace = true
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSObject", "NSOperation", "NSString", "block2"] }

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
